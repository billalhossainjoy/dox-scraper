name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**", "chore/**"]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The Hono API imports declarations and runtime code from the workspace
      # packages, so build those packages before TypeScript checks and tests.
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Test container scan report security gate
        run: node --test scripts/check-container-vulnerabilities.test.mjs

      - name: Test SQLite backup and isolated restore safety
        run: node --test scripts/sqlite-backup.test.mjs

      - name: Test isolated SQLite rollback safety
        run: node --test scripts/sqlite-restore-drill.test.mjs

      - name: Test Raspberry Pi deployment preflight offline
        run: node --test scripts/pi-preflight.test.mjs

      - name: Test Cloudflare Tunnel verification logic offline
        run: node --test scripts/verify-tunnel.test.mjs

      - name: Validate Docker Compose deployment
        env:
          DOX_SCRAPER_API_KEY: ci-not-a-real-secret
        run: docker compose -f compose.yaml config --quiet
