name: One-time verify current Node 24 image index
on:
  push:
    branches: [chore/029-trivy-vulnerability-remediation]
    paths: [".github/workflows/probe-node-image.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve latest official Node manifest without changing production
        shell: bash
        run: |
          set -euo pipefail
          ref="docker.io/library/node:24-bookworm-slim"
          manifest="$(docker buildx imagetools inspect --raw "$ref")"
          printf '%s' "$manifest" | jq -e '
            [.manifests[] | select(.platform.os == "linux") | .platform.architecture]
              | (index("amd64") != null and index("arm64") != null)
          '
          digest="sha256:$(printf '%s' "$manifest" | sha256sum | awk '{print $1}')"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          # Independently resolve the digest-addressed index (no moving tag).
          resolved="$(docker buildx imagetools inspect --raw "docker.io/library/node@$digest")"
          test "$(printf '%s' "$resolved" | sha256sum | awk '{print $1}')" = "${digest#sha256:}"
          echo "VERIFIED_LATEST_NODE_24_MULTIARCH_DIGEST=$digest"
