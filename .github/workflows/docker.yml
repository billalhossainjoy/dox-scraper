name: Docker Compose deployment

on:
  pull_request:
    paths:
      - "docker/**"
      - ".dockerignore"
      - "compose.yaml"
      - "apps/worker/**"
      - "packages/storage/**"
      - ".github/workflows/docker.yml"
      - "scripts/verify-docker-base.sh"
      - "scripts/sqlite-backup.mjs"
      - "scripts/sqlite-backup.test.mjs"
      - "scripts/sqlite-restore-drill.mjs"
      - "scripts/sqlite-restore-drill.test.mjs"
  push:
    branches: [main]
    paths:
      - "docker/**"
      - ".dockerignore"
      - "compose.yaml"
      - "apps/worker/**"
      - "packages/storage/**"
      - ".github/workflows/docker.yml"
      - "scripts/verify-docker-base.sh"
      - "scripts/sqlite-backup.mjs"
      - "scripts/sqlite-backup.test.mjs"
      - "scripts/sqlite-restore-drill.mjs"
      - "scripts/sqlite-restore-drill.test.mjs"

permissions:
  contents: read

jobs:
  compose-smoke:
    runs-on: ubuntu-latest
    env:
      # Test-only value; no user/production secrets are used by CI.
      DOX_ENABLE_CRAWL_API: "false"
      DOX_PUBLIC_HOSTNAME: scraper.ci.example.test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate an ephemeral CI-only API bearer key
        shell: bash
        run: |
          set -euo pipefail
          token="$(openssl rand -hex 32)"
          echo "::add-mask::$token"
          echo "DOX_SCRAPER_API_KEY=$token" >> "$GITHUB_ENV"

      - name: Validate Compose configuration
        run: docker compose -f compose.yaml config --quiet

      - name: Verify pinned Node base supports ARM64 and AMD64
        run: bash scripts/verify-docker-base.sh

      - name: Build API and worker images
        run: docker compose -f compose.yaml build api worker

      - name: Reject unsafe production settings before opening the API port
        shell: bash
        run: |
          set -euo pipefail
          for unsafe in "replace-with-a-long-random-secret" "weak-key" "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"; do
            if docker compose run --rm --no-deps -e "DOX_SCRAPER_API_KEY=$unsafe" api >/tmp/dox-preflight.log 2>&1; then
              echo "ERROR: production API started with an unsafe bearer credential"
              exit 1
            fi
            grep -q "DOX_SCRAPER_API_KEY" /tmp/dox-preflight.log
            if grep -Fq "$unsafe" /tmp/dox-preflight.log; then
              echo "ERROR: preflight leaked the rejected credential"
              exit 1
            fi
          done
          if docker compose run --rm --no-deps -e DOX_ENABLE_CRAWL_API=yes api >/tmp/dox-preflight.log 2>&1; then
            echo "ERROR: production API started with malformed crawl feature flag"
            exit 1
          fi
          grep -q "DOX_ENABLE_CRAWL_API" /tmp/dox-preflight.log

      - name: Start API and worker
        run: docker compose -f compose.yaml up --detach --no-build

      - name: Check API and worker health
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000/health >/dev/null 2>&1 &&
               docker compose exec -T worker node apps/worker/dist/health.js >/dev/null 2>&1; then
              docker compose ps
              exit 0
            fi
            sleep 2
          done
          docker compose logs --tail=200
          exit 1

      - name: Verify host restrictions and API bearer independently
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:3000/health >/dev/null
          bad_host=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H 'Host: unapproved.example.test' http://127.0.0.1:3000/health)
          test "$bad_host" = "421"
          no_token=$(curl -sS -o /dev/null -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' \
            --data '{}' http://127.0.0.1:3000/v1/scrape)
          test "$no_token" = "401"
          bad_token=$(curl -sS -o /dev/null -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' \
            -H 'Authorization: Bearer deliberately-invalid' \
            --data '{}' http://127.0.0.1:3000/v1/scrape)
          test "$bad_token" = "401"
          good_token=$(curl -sS -o /dev/null -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' \
            -H "Authorization: Bearer $DOX_SCRAPER_API_KEY" \
            --data '{}' http://127.0.0.1:3000/v1/scrape)
          test "$good_token" = "400"

      - name: Verify SQLite volume survives container recreation
        shell: bash
        run: |
          set -euo pipefail
          docker compose exec -T worker node -e "
            const { DatabaseSync } = require('node:sqlite');
            const db = new DatabaseSync('/data/dox.sqlite');
            db.exec('CREATE TABLE IF NOT EXISTS deployment_probe (id INTEGER PRIMARY KEY, value TEXT)');
            db.prepare('INSERT OR REPLACE INTO deployment_probe(id,value) VALUES(1,?)').run('persisted');
            db.close();
          "
          docker compose down
          docker compose up --detach --no-build
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000/health >/dev/null 2>&1 &&
               docker compose exec -T worker node apps/worker/dist/health.js >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker compose exec -T worker node -e "
            const { DatabaseSync } = require('node:sqlite');
            const db = new DatabaseSync('/data/dox.sqlite');
            const row = db.prepare('SELECT value FROM deployment_probe WHERE id=1').get();
            db.close();
            if (row?.value !== 'persisted') process.exit(1);
          "

      - name: Verify online SQLite backup and isolated restore from a networkless worker
        shell: bash
        run: |
          set -euo pipefail
          backup_dir="$RUNNER_TEMP/dox-backup-smoke"
          mkdir -p "$backup_dir"
          sudo chown 1000:1000 "$backup_dir"
          docker compose run --rm --no-deps -T \
            --volume "$backup_dir:/backups:rw" \
            --entrypoint node worker \
            /app/scripts/sqlite-backup.mjs \
            --source /data/dox.sqlite \
            --destination /backups/smoke.sqlite
          test -s "$backup_dir/smoke.sqlite"
          test "$(stat -c '%a' "$backup_dir/smoke.sqlite")" = "600"
          # A second backup with the same destination must NOT overwrite it.
          if docker compose run --rm --no-deps -T \
            --volume "$backup_dir:/backups:rw" \
            --entrypoint node worker \
            /app/scripts/sqlite-backup.mjs \
            --source /data/dox.sqlite \
            --destination /backups/smoke.sqlite >/tmp/dox-backup-refusal.log 2>&1; then
            echo "ERROR: existing backup was overwritten"
            exit 1
          fi
          grep -q "already exists" /tmp/dox-backup-refusal.log

      - name: Rehearse isolated rollback into a new disposable Docker volume
        shell: bash
        run: |
          set -euo pipefail
          # The existing Compose volume is never mounted by the restore
          # process. The disposable volume is created specifically for CI.
          restore_volume="dox-ci-restore-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          restore_container="dox-ci-rollback-${GITHUB_RUN_ID}"
          cleanup() {
            docker rm -f "$restore_container" >/dev/null 2>&1 || true
            docker volume rm "$restore_volume" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker volume create "$restore_volume" >/dev/null
          # Initialize permissions on the NEW EMPTY volume only; the actual
          # restore is run as the non-root worker without network access.
          docker run --rm --network none --user 0:0 \
            --volume "$restore_volume:/restore-drill" \
            --entrypoint sh dox-scraper-worker:local \
            -c 'chown 1000:1000 /restore-drill'
          docker run --rm --network none --user 1000:1000 \
            --volume "$restore_volume:/restore-drill" \
            --entrypoint node dox-scraper-worker:local \
            -e 'const fs=require("node:fs");fs.writeFileSync("/restore-drill/.dox-disposable-restore-volume","DOX_SCRAPER_DISPOSABLE_RESTORE_V1\n",{mode:0o600})'

          backup_dir="$RUNNER_TEMP/dox-backup-smoke"
          backup_hash="$(sha256sum "$backup_dir/smoke.sqlite" | cut -d' ' -f1)"

          # Simulate a bad upgrade on the EXISTING CI database, after the
          # backup was made. The rollback copy must retain the old value.
          docker compose exec -T worker node -e "
            const {DatabaseSync}=require('node:sqlite');
            const db=new DatabaseSync('/data/dox.sqlite');
            db.prepare('UPDATE deployment_probe SET value=? WHERE id=1').run('after-upgrade');
            db.close();
          "

          docker run --rm --network none --user 1000:1000 \
            --read-only --tmpfs /tmp:rw,nosuid,size=32m \
            --cap-drop ALL --security-opt no-new-privileges \
            --volume "$restore_volume:/restore-drill" \
            --volume "$backup_dir:/backups:ro" \
            --entrypoint node dox-scraper-worker:local \
            /app/scripts/sqlite-restore-drill.mjs \
            --backup /backups/smoke.sqlite \
            --target-dir /restore-drill \
            --sha256 "$backup_hash"

          # The restored DB is examined in its NEW volume. No production
          # volume is mounted in this container.
          docker run --rm --network none --user 1000:1000 \
            --volume "$restore_volume:/data:ro" \
            --entrypoint node dox-scraper-worker:local -e "
            const {DatabaseSync}=require('node:sqlite');
            const db=new DatabaseSync('/data/dox.sqlite',{readOnly:true});
            const result=db.prepare('SELECT value FROM deployment_probe WHERE id=1').get();
            if(result?.value !== 'persisted') process.exit(1);
            db.close();
          "

          # Boot the same API against only the disposable rollback database,
          # without host ports or any network interface.
          token="$(openssl rand -hex 32)"
          docker run --detach --name "$restore_container" \
            --network none --user 1000:1000 \
            --read-only --tmpfs /tmp:rw,nosuid,size=32m \
            --cap-drop ALL --security-opt no-new-privileges \
            --volume "$restore_volume:/data" \
            -e NODE_ENV=production -e PORT=3000 \
            -e DOX_ENABLE_CRAWL_API=false \
            -e DOX_ENABLE_BROWSER_RENDERING=false \
            -e "DOX_SCRAPER_API_KEY=$token" \
            dox-scraper-api:local

          ready=false
          for i in $(seq 1 30); do
            if docker exec "$restore_container" node -e "
              fetch('http://127.0.0.1:3000/health',{signal:AbortSignal.timeout(2500)})
              .then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true

          # Original CI DB was not rolled back. Both values must differ.
          docker compose exec -T worker node -e "
            const {DatabaseSync}=require('node:sqlite');
            const db=new DatabaseSync('/data/dox.sqlite',{readOnly:true});
            const result=db.prepare('SELECT value FROM deployment_probe WHERE id=1').get();
            if(result?.value !== 'after-upgrade') process.exit(1);
            db.close();
          "

      - name: Deployment logs on failure
        if: failure()
        run: docker compose logs --tail=200 || true

      - name: Stop containers without deleting data
        if: always()
        run: docker compose down || true


  arm64-emulated-smoke:
    # Real ARM64 Docker image execution under QEMU, not a physical Pi test.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Register ARM64 QEMU interpreter
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Configure multi-platform Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ARM64 API and worker targets (no emulated amd64 dependencies)
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build --platform linux/arm64 \
            --file docker/Dockerfile --target api \
            --tag dox-scraper-api:arm64 --load .
          docker buildx build --platform linux/arm64 \
            --file docker/Dockerfile --target worker \
            --tag dox-scraper-worker:arm64 --load .
          test "$(docker image inspect dox-scraper-api:arm64 --format '{{.Architecture}}')" = arm64
          test "$(docker image inspect dox-scraper-worker:arm64 --format '{{.Architecture}}')" = arm64

      - name: Check actual ARM64 Node and SQLite execution
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --platform linux/arm64 --network none \
            dox-scraper-api:arm64 \
            node -e "const { DatabaseSync } = require('node:sqlite'); \
              if (process.arch !== 'arm64') process.exit(1); \
              const db = new DatabaseSync(':memory:'); \
              db.exec('CREATE TABLE smoke(value INTEGER)'); \
              db.prepare('INSERT INTO smoke(value) VALUES (42)').run(); \
              if (db.prepare('SELECT value FROM smoke').get().value !== 42) process.exit(1); \
              db.close();"

      - name: Smoke-test the ARM64 API with no external network
        shell: bash
        run: |
          set -euo pipefail
          token="$(openssl rand -hex 32)"
          docker run --detach --name dox-api-arm64 \
            --platform linux/arm64 --network none \
            --read-only --tmpfs /tmp:rw,nosuid,size=32m \
            --tmpfs /data:rw,nosuid,size=32m,uid=1000,gid=1000 \
            --user 1000:1000 --cap-drop ALL \
            -e NODE_ENV=production -e PORT=3000 \
            -e DOX_ENABLE_BROWSER_RENDERING=false \
            -e DOX_ENABLE_CRAWL_API=false \
            -e "DOX_SCRAPER_API_KEY=$token" \
            dox-scraper-api:arm64
          ready=false
          for i in $(seq 1 50); do
            if docker exec dox-api-arm64 node -e "
              fetch('http://127.0.0.1:3000/health', {signal: AbortSignal.timeout(3000)})
                .then(r => process.exit(r.ok ? 0 : 1))
                .catch(() => process.exit(1))" >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 3
          done
          if [ "$ready" != true ]; then
            docker logs dox-api-arm64 --tail=100
            exit 1
          fi

      - name: Smoke-test the networkless ARM64 maintenance worker
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name dox-worker-arm64 \
            --platform linux/arm64 --network none \
            --read-only --tmpfs /tmp:rw,nosuid,size=32m \
            --tmpfs /data:rw,nosuid,size=32m,uid=1000,gid=1000 \
            --user 1000:1000 --cap-drop ALL \
            -e DOX_CRAWL_DB_PATH=/data/dox.sqlite \
            -e DOX_WORKER_INTERVAL_SECONDS=60 \
            dox-scraper-worker:arm64
          ready=false
          for i in $(seq 1 40); do
            if docker exec dox-worker-arm64 \
              node apps/worker/dist/health.js >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 3
          done
          if [ "$ready" != true ]; then
            docker logs dox-worker-arm64 --tail=100
            exit 1
          fi

      - name: Show container logs on ARM64 smoke failure
        if: failure()
        run: |
          docker logs dox-api-arm64 --tail=100 || true
          docker logs dox-worker-arm64 --tail=100 || true

      - name: Remove ephemeral ARM64 test containers
        if: always()
        run: |
          docker rm -f dox-api-arm64 dox-worker-arm64 || true
