name: Docker Compose deployment

on:
  pull_request:
    paths:
      - "docker/**"
      - ".dockerignore"
      - "compose.yaml"
      - "apps/worker/**"
      - "packages/storage/**"
      - ".github/workflows/docker.yml"
  push:
    branches: [main]
    paths:
      - "docker/**"
      - ".dockerignore"
      - "compose.yaml"
      - "apps/worker/**"
      - "packages/storage/**"
      - ".github/workflows/docker.yml"

permissions:
  contents: read

jobs:
  compose-smoke:
    runs-on: ubuntu-latest
    env:
      # Test-only value; no user/production secrets are used by CI.
      DOX_ENABLE_CRAWL_API: "false"
      DOX_PUBLIC_HOSTNAME: scraper.ci.example.test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate an ephemeral CI-only API bearer key
        shell: bash
        run: |
          set -euo pipefail
          token="$(openssl rand -hex 32)"
          echo "::add-mask::$token"
          echo "DOX_SCRAPER_API_KEY=$token" >> "$GITHUB_ENV"

      - name: Validate Compose configuration
        run: docker compose -f compose.yaml config --quiet

      - name: Verify pinned Node base supports ARM64 and AMD64
        run: bash scripts/verify-docker-base.sh

      - name: Build API and worker images
        run: docker compose -f compose.yaml build api worker

      - name: Reject unsafe production settings before opening the API port
        shell: bash
        run: |
          set -euo pipefail
          for unsafe in "replace-with-a-long-random-secret" "weak-key" "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"; do
            if docker compose run --rm --no-deps -e "DOX_SCRAPER_API_KEY=$unsafe" api >/tmp/dox-preflight.log 2>&1; then
              echo "ERROR: production API started with an unsafe bearer credential"
              exit 1
            fi
            grep -q "DOX_SCRAPER_API_KEY" /tmp/dox-preflight.log
            if grep -Fq "$unsafe" /tmp/dox-preflight.log; then
              echo "ERROR: preflight leaked the rejected credential"
              exit 1
            fi
          done
          if docker compose run --rm --no-deps -e DOX_ENABLE_CRAWL_API=yes api >/tmp/dox-preflight.log 2>&1; then
            echo "ERROR: production API started with malformed crawl feature flag"
            exit 1
          fi
          grep -q "DOX_ENABLE_CRAWL_API" /tmp/dox-preflight.log

      - name: Start API and worker
        run: docker compose -f compose.yaml up --detach --no-build

      - name: Check API and worker health
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000/health >/dev/null 2>&1 &&
               docker compose exec -T worker node apps/worker/dist/health.js >/dev/null 2>&1; then
              docker compose ps
              exit 0
            fi
            sleep 2
          done
          docker compose logs --tail=200
          exit 1

      - name: Verify host restrictions and API bearer independently
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:3000/health >/dev/null
          bad_host=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H 'Host: unapproved.example.test' http://127.0.0.1:3000/health)
          test "$bad_host" = "421"
          no_token=$(curl -sS -o /dev/null -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' \
            --data '{}' http://127.0.0.1:3000/v1/scrape)
          test "$no_token" = "401"
          bad_token=$(curl -sS -o /dev/null -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' \
            -H 'Authorization: Bearer deliberately-invalid' \
            --data '{}' http://127.0.0.1:3000/v1/scrape)
          test "$bad_token" = "401"
          good_token=$(curl -sS -o /dev/null -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' \
            -H "Authorization: Bearer $DOX_SCRAPER_API_KEY" \
            --data '{}' http://127.0.0.1:3000/v1/scrape)
          test "$good_token" = "400"

      - name: Verify SQLite volume survives container recreation
        shell: bash
        run: |
          set -euo pipefail
          docker compose exec -T worker node -e "
            const { DatabaseSync } = require('node:sqlite');
            const db = new DatabaseSync('/data/dox.sqlite');
            db.exec('CREATE TABLE IF NOT EXISTS deployment_probe (id INTEGER PRIMARY KEY, value TEXT)');
            db.prepare('INSERT OR REPLACE INTO deployment_probe(id,value) VALUES(1,?)').run('persisted');
            db.close();
          "
          docker compose down
          docker compose up --detach --no-build
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000/health >/dev/null 2>&1 &&
               docker compose exec -T worker node apps/worker/dist/health.js >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker compose exec -T worker node -e "
            const { DatabaseSync } = require('node:sqlite');
            const db = new DatabaseSync('/data/dox.sqlite');
            const row = db.prepare('SELECT value FROM deployment_probe WHERE id=1').get();
            db.close();
            if (row?.value !== 'persisted') process.exit(1);
          "

      - name: Deployment logs on failure
        if: failure()
        run: docker compose logs --tail=200 || true

      - name: Stop containers without deleting data
        if: always()
        run: docker compose down || true
