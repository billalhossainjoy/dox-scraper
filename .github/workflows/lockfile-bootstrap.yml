name: One-time pnpm lockfile bootstrap

# Temporary workflow removed from the branch after the generated
# pnpm-lock.yaml has been committed. It does not run in release builds.
on:
  push:
    branches:
      - chore/022-pnpm-frozen-lockfile
    paths:
      - ".github/workflows/lockfile-bootstrap.yml"

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate pnpm lockfile from the actual workspace manifests
        shell: bash
        run: |
          set -euo pipefail
          pnpm --version
          pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
          test -s pnpm-lock.yaml
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile already matches manifests"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore(deps): generate workspace pnpm lockfile"
          git push origin HEAD:chore/022-pnpm-frozen-lockfile
