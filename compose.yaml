name: dox-scraper

services:
  api:
    image: dox-scraper-api:local
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: api
    environment:
      NODE_ENV: production
      HOST: "0.0.0.0"
      PORT: "3000"
      DOX_SCRAPER_API_KEY: ${DOX_SCRAPER_API_KEY:?Set a unique DOX_SCRAPER_API_KEY in .env}
      DOX_ENABLE_CRAWL_API: ${DOX_ENABLE_CRAWL_API:-false}
      DOX_CRAWL_ALLOWED_ORIGINS: ${DOX_CRAWL_ALLOWED_ORIGINS:-}
      DOX_CRAWL_DB_PATH: /data/dox.sqlite
      # Must exactly match the hostname protected by Cloudflare Access.
      DOX_PUBLIC_HOSTNAME: ${DOX_PUBLIC_HOSTNAME:-}
      # Structured request telemetry contains route templates, not URL/body/credentials.
      DOX_HTTP_ACCESS_LOGS: ${DOX_HTTP_ACCESS_LOGS:-true}
      # Chromium is deliberately omitted from this non-isolated container.
      DOX_ENABLE_BROWSER_RENDERING: "false"
    ports:
      # No LAN or public binding. Cloudflare Tunnel on this same Pi host can connect
      # to this loopback port from the Raspberry Pi host.
      - "127.0.0.1:${DOX_BIND_PORT:-3000}:3000"
    volumes:
      - dox_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 768m
    cpus: 1.0
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health', {signal: AbortSignal.timeout(3000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    image: dox-scraper-worker:local
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: worker
    environment:
      NODE_ENV: production
      DOX_CRAWL_DB_PATH: /data/dox.sqlite
      DOX_WORKER_INTERVAL_SECONDS: ${DOX_WORKER_INTERVAL_SECONDS:-60}
      DOX_WORKER_HEARTBEAT: /tmp/dox-worker.heartbeat
    # Worker only prunes expired SQLite cache entries. It never needs a
    # network connection and is not a second, competing crawl executor.
    network_mode: none
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - dox_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 48
    mem_limit: 192m
    cpus: 0.25
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "node", "/app/apps/worker/dist/health.js"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  dox_data:
    # A named Docker volume persists across container recreation; keep
    # Docker's volume directory on an SSD-backed filesystem for Pi reliability.
